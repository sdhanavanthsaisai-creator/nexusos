<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="pool" cx="70%" cy="14%" r="78%">
      <stop offset="0" stop-color="#252b34"/>
      <stop offset="0.38" stop-color="#161a20"/>
      <stop offset="0.72" stop-color="#0a0b0e"/>
      <stop offset="1" stop-color="#040406"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="52%">
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#040406"/>
  <rect width="1600" height="1000" fill="url(#pool)"/>

  <!-- Concentric caustics: the folds the ripple displacement reads as motion. -->
  <g fill="none" stroke="#ffffff" filter="url(#soft)">
    <ellipse cx="1120" cy="150" rx="1520" ry="270" stroke-opacity="0.045" stroke-width="2"/>
    <ellipse cx="1120" cy="150" rx="1200" ry="215" stroke-opacity="0.055" stroke-width="2"/>
    <ellipse cx="1120" cy="150" rx="900" ry="165" stroke-opacity="0.06" stroke-width="2"/>
    <ellipse cx="1120" cy="150" rx="640" ry="118" stroke-opacity="0.055" stroke-width="2"/>
    <ellipse cx="1120" cy="150" rx="410" ry="76" stroke-opacity="0.05" stroke-width="2"/>
    <ellipse cx="1120" cy="150" rx="230" ry="42" stroke-opacity="0.04" stroke-width="2"/>
  </g>

  <rect width="1600" height="1000" fill="url(#rim)"/>
</svg>
