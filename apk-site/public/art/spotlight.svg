<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.52" r="0.46">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#c8ccd4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.82" cy="0.24" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="#07070a"/>
  <g filter="url(#soften)">
    <rect width="1600" height="800" fill="url(#core)"/>
    <rect width="1600" height="800" fill="url(#rim)"/>
  </g>
  <!-- Closely spaced contours: the ripple displaces the surface, so the pattern needs
       mid-frequency detail with real contrast or the distortion has nothing to reveal. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.1">
    <circle cx="800" cy="416" r="54"/>
    <circle cx="800" cy="416" r="112"/>
    <circle cx="800" cy="416" r="170"/>
    <circle cx="800" cy="416" r="228"/>
    <circle cx="800" cy="416" r="286"/>
    <circle cx="800" cy="416" r="344"/>
    <circle cx="800" cy="416" r="402"/>
    <circle cx="800" cy="416" r="460"/>
    <circle cx="800" cy="416" r="518"/>
    <circle cx="800" cy="416" r="576"/>
    <circle cx="800" cy="416" r="634"/>
    <circle cx="800" cy="416" r="692"/>
    <circle cx="800" cy="416" r="750"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <circle cx="800" cy="416" r="83"/>
    <circle cx="800" cy="416" r="113"/>
    <circle cx="800" cy="416" r="143"/>
    <circle cx="800" cy="416" r="173"/>
    <circle cx="800" cy="416" r="203"/>
    <circle cx="800" cy="416" r="233"/>
    <circle cx="800" cy="416" r="263"/>
    <circle cx="800" cy="416" r="293"/>
    <circle cx="800" cy="416" r="323"/>
    <circle cx="800" cy="416" r="353"/>
    <circle cx="800" cy="416" r="383"/>
    <circle cx="800" cy="416" r="413"/>
    <circle cx="800" cy="416" r="443"/>
    <circle cx="800" cy="416" r="473"/>
    <circle cx="800" cy="416" r="503"/>
    <circle cx="800" cy="416" r="533"/>
    <circle cx="800" cy="416" r="563"/>
    <circle cx="800" cy="416" r="593"/>
    <circle cx="800" cy="416" r="623"/>
    <circle cx="800" cy="416" r="653"/>
    <circle cx="800" cy="416" r="683"/>
    <circle cx="800" cy="416" r="713"/>
  </g>
  <rect width="1600" height="800" fill="url(#vignette)"/>
  <rect width="1600" height="800" filter="url(#grain)"/>
</svg>
